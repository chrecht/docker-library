workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'
    - when: never

stages:
  - discover
  - build
  - manifest
  - build-dev
  - manifest-dev
  - test

variables:
  PHP_MAJOR_VERSION: "8.5"
  PHP_OS_CODENAME: "trixie"
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

.docker-job:
  image: docker:cli
  services:
    - name: docker:dind
      alias: docker
  before_script:
    - docker info
    - test -n "$CI_REGISTRY" || (echo "GitLab Container Registry must be enabled for this project" >&2; exit 1)
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin

latest-version:
  stage: discover
  image: alpine:3.22
  before_script:
    - apk add --no-cache curl jq coreutils
  script:
    - |
      set -eu
      set -o pipefail

      for variant in apache cli; do
        tags=$(curl --fail --silent --show-error \
          "https://hub.docker.com/v2/repositories/library/php/tags?page_size=100&name=${PHP_MAJOR_VERSION}." \
          | jq -r '.results[].name')
        latest=$(printf '%s\n' "$tags" \
          | grep -E "^${PHP_MAJOR_VERSION}[.][0-9]+[.][0-9]+-${variant}-${PHP_OS_CODENAME}$" \
          | sort -V \
          | tail -n 1 || true)
        if [ -z "$latest" ]; then
          echo "Could not find a PHP ${PHP_MAJOR_VERSION} ${variant} ${PHP_OS_CODENAME} image tag" >&2
          exit 1
        fi

        version=${latest%%-${variant}-${PHP_OS_CODENAME}}
        major=$(printf '%s' "$version" | cut -d. -f1)
        minor=$(printf '%s' "$version" | cut -d. -f2)
        patch=$(printf '%s' "$version" | cut -d. -f3)
        printf '%s_VERSION=%s\n%s_MAJOR=%s\n%s_MINOR=%s\n%s_PATCH=%s\n' \
          "$(printf '%s' "$variant" | tr '[:lower:]' '[:upper:]')" "$version" \
          "$(printf '%s' "$variant" | tr '[:lower:]' '[:upper:]')" "$major" \
          "$(printf '%s' "$variant" | tr '[:lower:]' '[:upper:]')" "$minor" \
          "$(printf '%s' "$variant" | tr '[:lower:]' '[:upper:]')" "$patch" \
          >> versions.env
      done

      cat versions.env
  artifacts:
    reports:
      dotenv: versions.env
    expire_in: 1 week

build:
  extends: .docker-job
  stage: build
  needs:
    - job: latest-version
      artifacts: true
  parallel:
    matrix:
      - VARIANT: [apache, cli]
        ARCH: [amd64, arm64]
  script:
    - |
      set -eu
      case "$VARIANT" in
        apache) VERSION="$APACHE_VERSION" ;;
        cli) VERSION="$CLI_VERSION" ;;
        *) echo "Unsupported PHP variant: $VARIANT" >&2; exit 1 ;;
      esac
      IMAGE="$CI_REGISTRY_IMAGE/php"

      docker run --privileged --rm tonistiigi/binfmt --install all
      docker buildx create --use
      docker buildx build \
        --platform "linux/$ARCH" \
        --file "./php/$PHP_MAJOR_VERSION/$VARIANT/Dockerfile" \
        --tag "$IMAGE:$VERSION-$VARIANT-$ARCH" \
        --push \
        "./php/$PHP_MAJOR_VERSION/$VARIANT"

create-multiarch-manifests:
  extends: .docker-job
  stage: manifest
  needs:
    - job: latest-version
      artifacts: true
    - job: build
      artifacts: false
  parallel:
    matrix:
      - VARIANT: [apache, cli]
  script:
    - |
      set -eu
      case "$VARIANT" in
        apache) VERSION="$APACHE_VERSION"; MAJOR="$APACHE_MAJOR"; MINOR="$APACHE_MINOR" ;;
        cli) VERSION="$CLI_VERSION"; MAJOR="$CLI_MAJOR"; MINOR="$CLI_MINOR" ;;
        *) echo "Unsupported PHP variant: $VARIANT" >&2; exit 1 ;;
      esac
      IMAGE="$CI_REGISTRY_IMAGE/php"

      docker buildx imagetools create \
        --tag "$IMAGE:$MAJOR.$MINOR-$VARIANT" \
        --tag "$IMAGE:$VERSION-$VARIANT" \
        "$IMAGE:$VERSION-$VARIANT-amd64" \
        "$IMAGE:$VERSION-$VARIANT-arm64"

build-dev:
  extends: .docker-job
  stage: build-dev
  needs:
    - job: latest-version
      artifacts: true
    - job: create-multiarch-manifests
      artifacts: false
  parallel:
    matrix:
      - VARIANT: [apache, cli]
        ARCH: [amd64, arm64]
  script:
    - |
      set -eu
      case "$VARIANT" in
        apache) VERSION="$APACHE_VERSION" ;;
        cli) VERSION="$CLI_VERSION" ;;
        *) echo "Unsupported PHP variant: $VARIANT" >&2; exit 1 ;;
      esac
      IMAGE="$CI_REGISTRY_IMAGE/php"

      docker run --privileged --rm tonistiigi/binfmt --install all
      docker buildx create --use
      docker buildx build \
        --platform "linux/$ARCH" \
        --file "./php/$PHP_MAJOR_VERSION-dev/$VARIANT/Dockerfile" \
        --tag "$IMAGE:$VERSION-$VARIANT-dev-$ARCH" \
        --push \
        "./php/$PHP_MAJOR_VERSION-dev/$VARIANT"

create-multiarch-manifests-dev:
  extends: .docker-job
  stage: manifest-dev
  needs:
    - job: latest-version
      artifacts: true
    - job: build-dev
      artifacts: false
  parallel:
    matrix:
      - VARIANT: [apache, cli]
  script:
    - |
      set -eu
      case "$VARIANT" in
        apache) VERSION="$APACHE_VERSION"; MAJOR="$APACHE_MAJOR"; MINOR="$APACHE_MINOR" ;;
        cli) VERSION="$CLI_VERSION"; MAJOR="$CLI_MAJOR"; MINOR="$CLI_MINOR" ;;
        *) echo "Unsupported PHP variant: $VARIANT" >&2; exit 1 ;;
      esac
      IMAGE="$CI_REGISTRY_IMAGE/php"

      docker buildx imagetools create \
        --tag "$IMAGE:$MAJOR.$MINOR-$VARIANT-dev" \
        --tag "$IMAGE:$VERSION-$VARIANT-dev" \
        "$IMAGE:$VERSION-$VARIANT-dev-amd64" \
        "$IMAGE:$VERSION-$VARIANT-dev-arm64"

smoke-tests:
  extends: .docker-job
  stage: test
  needs:
    - job: latest-version
      artifacts: true
    - job: create-multiarch-manifests
      artifacts: false
  parallel:
    matrix:
      - ARCH: [amd64, arm64]
  script:
    - |
      set -eu
      docker run --privileged --rm tonistiigi/binfmt --install all
      IMAGE="$CI_REGISTRY_IMAGE/php"
      APACHE_IMAGE="$IMAGE:$APACHE_VERSION-apache"
      CLI_IMAGE="$IMAGE:$CLI_VERSION-cli"

      docker run -d --name php-apache-smoke \
        --platform "linux/$ARCH" \
        --volume "$CI_PROJECT_DIR/tests/php-$PHP_MAJOR_VERSION/html:/var/www/html:ro" \
        "$APACHE_IMAGE"

      docker exec php-apache-smoke php -v | grep -F "PHP $APACHE_MAJOR.$APACHE_MINOR"
      for extension in mysqli pdo_mysql amqp curl intl; do
        docker exec php-apache-smoke php -m | grep -Fx "$extension"
      done

      response=""
      attempt=0
      while [ "$attempt" -lt 15 ]; do
        response=$(docker exec php-apache-smoke php -r \
          'echo file_get_contents("http://127.0.0.1/health/");' 2>/dev/null || true)
        [ "$response" = "OK" ] && break
        sleep 1
        attempt=$((attempt + 1))
      done
      printf '%s\n' "$response"
      [ "$response" = "OK" ]
      docker rm -f php-apache-smoke

      docker run --rm --platform "linux/$ARCH" "$CLI_IMAGE" -v \
        | grep -F "PHP $CLI_MAJOR.$CLI_MINOR"
      for extension in mysqli pdo_mysql amqp curl intl; do
        docker run --rm --platform "linux/$ARCH" "$CLI_IMAGE" -m | grep -Fx "$extension"
      done
      docker run --rm --platform "linux/$ARCH" "$CLI_IMAGE" -r "echo 'OK';" | grep -Fx "OK"
  after_script:
    - docker rm -f php-apache-smoke >/dev/null 2>&1 || true
